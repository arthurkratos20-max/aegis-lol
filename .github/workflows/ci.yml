name: Aegis CI

on:
  push:
    branches:
      - main
      - "aegis/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test output (temporary diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build static production export
        run: npm run build

      - name: Audit champion kit coverage (173 champions)
        run: npm run audit:coverage

      - name: Upload static export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-static-export
          path: |
            out/
            artifacts/kit-coverage-*.json
          if-no-files-found: error
          retention-days: 7
