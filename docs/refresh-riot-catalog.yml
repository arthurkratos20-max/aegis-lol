name: Refresh Riot catalog
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: riot-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Validate and compile before publishing
        run: |
          npm test
          npm run build
          npm run typecheck
      - name: Publish validated catalog
        run: |
          git add public/data/pt_BR.json public/data/en_US.json public/data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'aegis-catalog-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated Riot catalog'
          git pull --rebase origin main
          git push origin HEAD:main
